<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradeWise — Student Portal</title>
<style>
  :root{
    --purple-900:#2a0e4d;
    --purple-800:#3b1666;
    --purple-700:#4c1d95;
    --purple-600:#5b21b6;
    --purple-500:#7c3aed;
    --purple-400:#9061f9;
    --gold:#f5b400;
    --bg:#f6f4fb;
    --card:#ffffff;
    --ink:#221334;
    --muted:#786a91;
    --line:#ece7f6;
    --danger:#e0553f;
    --good:#1f8a4c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#efe9fb 0%, #f7f2fb 60%, #f4eefb 100%);
    padding:24px;
  }
  .login-box{width:100%;max-width:420px;text-align:center;}
  .login-logo{
    width:64px;height:64px;border-radius:16px;
    background:linear-gradient(135deg,var(--purple-600),var(--purple-800));
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
    font-size:28px;box-shadow:0 8px 20px rgba(76,29,149,.35);
  }
  .login-brand{font-size:26px;font-weight:800;color:#1f2d6b;}
  .login-brand span{background:#3557d6;color:#fff;padding:0 6px;border-radius:3px;}
  .login-sub{color:var(--muted);margin:6px 0 28px;font-size:14px;}
  .login-card{background:var(--card);border-radius:20px;padding:28px;box-shadow:0 20px 40px rgba(80,40,140,.10);text-align:left;}
  .field-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:#5c4d78;margin-bottom:6px;display:block;}
  .field{position:relative;margin-bottom:18px;}
  .field input{
    width:100%;padding:12px 14px 12px 38px;border-radius:12px;border:1px solid var(--line);
    background:#faf9fd;font-size:14px;color:var(--ink);outline:none;
  }
  .field input:focus{border-color:var(--purple-500);}
  .field .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#a99bc4;font-size:14px;}
  .login-btn{
    width:100%;padding:13px;border:none;border-radius:12px;
    background:linear-gradient(135deg,var(--purple-500),var(--purple-700));
    color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 10px 20px rgba(124,58,237,.30);
  }
  .login-btn:hover{filter:brightness(1.05);}
  .login-foot{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
  .login-foot b{color:var(--purple-600);cursor:pointer;}

  /* ---------- APP SHELL ---------- */
  #app-screen{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}

  .sidebar{
    width:250px;flex-shrink:0;
    background:linear-gradient(180deg,#3a1566 0%, #1c0b38 55%, #12071f 100%);
    color:#e3d9f7;padding:18px 14px;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sb-brand{display:flex;align-items:center;gap:10px;padding:6px 6px 18px;}
  .sb-logo{
    width:36px;height:36px;border-radius:10px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#3b1666;font-size:16px;
  }
  .sb-name{font-weight:800;font-size:15px;color:#fff;line-height:1.1;}
  .sb-name small{display:block;font-size:9px;letter-spacing:.08em;color:#b8a6dd;font-weight:700;}
  .sb-search{
    background:rgba(255,255,255,.07);border-radius:10px;padding:9px 12px;font-size:12.5px;
    color:#c8bbe6;margin-bottom:16px;
  }
  .sb-group-label{font-size:10px;letter-spacing:.09em;color:#8672ad;font-weight:700;margin:14px 8px 6px;}
  .sb-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;
    color:#d7cbef;cursor:pointer;margin-bottom:2px;position:relative;
  }
  .sb-item .ic{width:16px;text-align:center;font-size:13px;}
  .sb-item:hover{background:rgba(255,255,255,.06);}
  .sb-item.active{background:rgba(255,255,255,.14);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--gold);}
  .sb-badge{
    margin-left:auto;background:var(--danger);color:#fff;font-size:9px;font-weight:700;
    padding:1px 6px;border-radius:20px;
  }
  .sb-user{
    margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--purple-500);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;}
  .sb-user-name{font-size:12.5px;font-weight:700;color:#fff;}
  .sb-user-sub{font-size:10.5px;color:#a996cf;}

  .main{flex:1;min-width:0;padding:20px 26px 90px;}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .search-bar{
    flex:1;background:#fff;border-radius:12px;padding:10px 16px;font-size:13.5px;color:#9689ad;
    box-shadow:0 2px 8px rgba(60,30,110,.05);border:1px solid var(--line);
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(60,30,110,.05);border:1px solid var(--line);position:relative;font-size:14px;flex-shrink:0;
  }
  .icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;background:var(--danger);border-radius:50%;}
  .avatar-btn{
    width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--purple-500),var(--purple-700));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;
  }

  .banner{
    background:linear-gradient(120deg,#6d28d9,#4c1d95 65%, #341066);
    border-radius:20px;padding:26px 28px;color:#fff;position:relative;overflow:hidden;margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:center;gap:24px;
  }
  .banner-eyebrow{font-size:10.5px;letter-spacing:.1em;font-weight:700;color:#d9c8fb;text-transform:uppercase;}
  .banner-title{font-size:24px;font-weight:800;margin:6px 0 8px;font-family:Georgia,'Times New Roman',serif;}
  .banner-sub{font-size:13.5px;color:#e4d8fb;max-width:520px;line-height:1.5;}
  .banner-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .btn-gold{background:var(--gold);color:#3b1666;border:none;padding:9px 16px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;}
  .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;}
  .btn-gold:hover,.btn-ghost:hover{filter:brightness(1.08);}
  .banner-side{
    background:rgba(0,0,0,.18);border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0;
  }
  .ring{
    width:56px;height:56px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;
  }
  .side-label{font-size:9.5px;letter-spacing:.08em;color:#d9c8fb;font-weight:700;}
  .side-value{font-size:14px;font-weight:800;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .stat-card{
    background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 2px 10px rgba(60,30,110,.05);
    border:1px solid var(--line);
  }
  .stat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .stat-icon{
    width:32px;height:32px;border-radius:9px;background:#f1e9fd;color:var(--purple-600);
    display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  .stat-pill{background:#f4edff;color:var(--purple-600);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .stat-num{font-size:24px;font-weight:800;font-family:Georgia,'Times New Roman',serif;}
  .stat-label{font-size:12px;color:var(--muted);margin-top:2px;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .panel{background:var(--card);border-radius:16px;padding:20px 22px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(60,30,110,.05);}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .panel-title{font-size:15px;font-weight:800;}
  .panel-link{font-size:12px;color:var(--purple-600);font-weight:700;cursor:pointer;}

  .list-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px;}
  .list-row:last-child{border-bottom:none;}
  .list-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .tag-chip{
    width:34px;height:34px;border-radius:9px;background:#f1e9fd;color:var(--purple-600);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;
  }
  .list-title{font-size:13.5px;font-weight:700;}
  .list-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .list-right{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;flex-shrink:0;}
  .status-chip{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:#f1e9fd;color:var(--purple-600);white-space:nowrap;}
  .status-chip.warn{background:#fff2df;color:#a6690a;}
  .status-chip.bad{background:#fde6e2;color:var(--danger);}
  .status-chip.good{background:#e4f7ea;color:#1f8a4c;}

  .bar-row{margin-bottom:14px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .bar-name{font-weight:700;}
  .bar-val{font-weight:700;color:var(--purple-600);}
  .bar-track{height:8px;background:#efe8fb;border-radius:20px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--purple-500),var(--purple-700));border-radius:20px;}
  .bar-note{font-size:11px;color:var(--muted);margin-top:4px;}

  .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .quick-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(60,30,110,.05);cursor:pointer;}
  .quick-icon{width:38px;height:38px;border-radius:10px;background:#f1e9fd;color:var(--purple-600);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px;}
  .quick-title{font-weight:800;font-size:13.5px;}
  .quick-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

  .section-title{font-size:15px;font-weight:800;margin:22px 0 12px;}

  /* ---------- COURSES / LEARNING ---------- */
  .course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .course-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:0 2px 10px rgba(60,30,110,.05);cursor:pointer;display:flex;flex-direction:column;
    transition:border-color .15s, transform .15s;
  }
  .course-card:hover{border-color:var(--purple-400);transform:translateY(-2px);}
  .cc-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .cc-tag{
    width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--purple-500),var(--purple-700));
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;
  }
  .cc-name{font-weight:800;font-size:14.5px;}
  .cc-meta{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .cc-desc{font-size:12.5px;color:#5c4d78;line-height:1.5;margin-bottom:14px;flex:1;}
  .cc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
  .cc-count{font-size:11.5px;color:var(--muted);}
  .btn-solid{
    background:linear-gradient(135deg,var(--purple-500),var(--purple-700));color:#fff;border:none;
    padding:8px 14px;border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;
  }
  .btn-solid:hover{filter:brightness(1.08);}
  .btn-outline{
    background:#fff;color:var(--purple-600);border:1px solid var(--purple-400);
    padding:8px 14px;border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;
  }
  .btn-outline:hover{background:#f6f0ff;}
  .btn-outline[disabled]{opacity:.45;cursor:not-allowed;}

  .crumbs{font-size:12.5px;color:var(--muted);margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap;}
  .crumbs b{color:var(--purple-600);cursor:pointer;font-weight:700;}
  .crumbs b:hover{text-decoration:underline;}

  .split{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start;}
  .sticky{position:sticky;top:16px;}
  .lesson-row{cursor:pointer;}
  .lesson-row:hover .list-title{color:var(--purple-600);}
  .check{
    width:24px;height:24px;border-radius:50%;border:2px solid #d8cdef;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800;
  }
  .check.on{background:var(--good);border-color:var(--good);}
  .check.now{border-color:var(--purple-500);box-shadow:0 0 0 3px rgba(124,58,237,.18);}

  .lesson-panel{padding:26px 30px;}
  .lesson-eyebrow{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px;}
  .lesson-h{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:800;margin:0 0 4px;}
  .lesson-body p{font-size:14.5px;line-height:1.75;color:#33244b;max-width:68ch;margin:14px 0;}
  .keybox{background:#f6f0ff;border-left:4px solid var(--purple-500);border-radius:10px;padding:14px 18px;margin:20px 0;}
  .keybox h4{margin:0 0 8px;font-size:13.5px;}
  .keybox ul{margin:0;padding-left:18px;}
  .keybox li{font-size:13.5px;line-height:1.6;margin-bottom:4px;}
  .codeblock{
    background:#1c0b38;color:#eadffd;border-radius:12px;padding:16px 18px;overflow-x:auto;margin:18px 0;
    font-family:Consolas,'Courier New',monospace;font-size:12.8px;line-height:1.6;white-space:pre;
  }
  .code-cap{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:18px;}
  .quiz{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:22px;background:#fcfbff;}
  .quiz h4{margin:0 0 4px;font-size:13.5px;}
  .quiz-q{font-size:14.5px;font-weight:700;margin:6px 0 12px;line-height:1.5;}
  .q-opt{
    display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;margin-bottom:8px;font-size:13.5px;color:var(--ink);cursor:pointer;
  }
  .q-opt:hover:not([disabled]){border-color:var(--purple-400);background:#faf6ff;}
  .q-opt.correct{background:#e4f7ea;border-color:#1f8a4c;color:#14653a;font-weight:700;}
  .q-opt.wrong{background:#fde6e2;border-color:var(--danger);color:#a63624;}
  .q-exp{display:none;font-size:13px;line-height:1.55;color:#33244b;background:#fff;border:1px dashed var(--purple-400);border-radius:10px;padding:10px 14px;margin-top:4px;}
  .lesson-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .done-note{font-size:12.5px;color:var(--good);font-weight:700;}

  /* ---------- CHATBOT ---------- */
  .chat-fab{
    position:fixed;right:22px;bottom:22px;z-index:50;height:54px;padding:0 20px 0 16px;border:none;border-radius:30px;
    background:linear-gradient(135deg,var(--purple-500),var(--purple-700));color:#fff;font-weight:700;font-size:14px;
    display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 12px 28px rgba(76,29,149,.45);
  }
  .chat-fab:hover{filter:brightness(1.08);}
  .chat-fab .pip{width:9px;height:9px;border-radius:50%;background:var(--gold);}
  .chat-panel{
    position:fixed;right:22px;bottom:90px;z-index:51;width:370px;max-width:calc(100vw - 24px);height:540px;max-height:calc(100vh - 110px);
    background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(40,10,90,.35);border:1px solid var(--line);
    display:none;flex-direction:column;overflow:hidden;
  }
  .chat-panel.open{display:flex;}
  .chat-head{
    background:linear-gradient(120deg,#6d28d9,#3b1666);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;
  }
  .chat-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#3b1666;display:flex;align-items:center;justify-content:center;font-weight:800;}
  .chat-head-t{font-weight:800;font-size:14px;line-height:1.2;}
  .chat-head-s{font-size:11px;color:#d9c8fb;}
  .chat-x{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;}
  .chat-msgs{flex:1;overflow-y:auto;padding:14px;background:#faf8fe;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13.2px;line-height:1.55;word-wrap:break-word;}
  .msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.user{background:linear-gradient(135deg,var(--purple-500),var(--purple-700));color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .msg b{font-weight:700;}
  .msg ul{margin:6px 0 0;padding-left:18px;}
  .chat-link{
    display:inline-block;margin:6px 6px 0 0;background:#f1e9fd;color:var(--purple-600);border:none;border-radius:20px;
    padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;
  }
  .chat-link:hover{background:#e6d9fb;}
  .chat-chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;background:#faf8fe;}
  .chat-chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:11.8px;color:var(--purple-600);font-weight:700;cursor:pointer;}
  .chat-chip:hover{border-color:var(--purple-400);}
  .chat-input{display:flex;gap:8px;padding:12px;background:#faf8fe;border-top:1px solid var(--line);}
  .chat-input input{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font-size:13.5px;outline:none;background:#fff;}
  .chat-input input:focus{border-color:var(--purple-500);}
  .chat-send{border:none;background:var(--purple-600);color:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:15px;}
  .typing{display:inline-flex;gap:4px;}
  .typing i{width:6px;height:6px;border-radius:50%;background:#b9a8d9;animation:blink 1s infinite;}
  .typing i:nth-child(2){animation-delay:.15s;} .typing i:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.typing i{animation:none}.course-card{transition:none}}

  @media (max-width:980px){
    .sidebar{display:none;}
    .stat-grid,.quick-grid{grid-template-columns:repeat(2,1fr);}
    .two-col,.split{grid-template-columns:1fr;}
    .course-grid{grid-template-columns:repeat(2,1fr);}
    .banner{flex-direction:column;align-items:flex-start;}
    .sticky{position:static;}
    .lesson-panel{padding:20px;}
  }
  @media (max-width:620px){
    .course-grid{grid-template-columns:1fr;}
    .main{padding:16px 14px 90px;}
    .chat-panel{right:12px;bottom:84px;}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🎓</div>
    <div class="login-brand"><span>GradeWise</span></div>
    <div class="login-sub">Academic Attendance &amp; Performance Tracker</div>
    <div class="login-card">
      <label class="field-label">EMAIL</label>
      <div class="field"><span class="icon">✉</span><input id="email" type="email" placeholder="you@college.edu"></div>
      <label class="field-label">PASSWORD</label>
      <div class="field"><span class="icon">🔒</span><input id="password" type="password" placeholder="••••••••"></div>
      <button class="login-btn" onclick="doLogin()">Login</button>
    </div>
    <div class="login-foot">Don't have an account? <b>Register</b></div>
  </div>
</div>

<!-- ===================== APP ===================== -->

/* =====================================================================
   COURSES — full study material (units → lessons)
   Each lesson: t=title, m=minutes, x=explanation paragraphs,
   k=key points, c=code example (optional), q=quiz {q,o,a,e}
   ===================================================================== */
const COURSES = [

{id:'ds', code:'CS301', tag:'DS', name:'Data Structures', faculty:'Prof. Meenakshi', credits:4,
 desc:'How data is organised in memory: lists, stacks, queues, trees and graphs, and the cost of every operation on them.',
 units:[
  {title:'Unit 1 · Linear structures', lessons:[
    {t:'Arrays and linked lists', m:8,
     x:[`An array stores its elements in contiguous memory, so any element can be reached in constant time using its index. The price is a fixed size: inserting or deleting in the middle forces every later element to shift, which takes O(n) time.`,
        `A linked list stores each element in a node that holds the data and a pointer to the next node. Nodes can sit anywhere in memory, so inserting or deleting after a known node only rewires pointers. Reaching the k-th element, however, means walking the list from the head.`],
     k:[`Array: O(1) access, O(n) insert or delete in the middle`,`Linked list: O(n) access, O(1) insert or delete after a known node`,`Choose arrays for frequent reads by index, linked lists for frequent insertions and deletions`],
     c:`struct Node {
    int data;
    struct Node *next;
};

// insert a new node at the head of the list
struct Node* push(struct Node *head, int value) {
    struct Node *n = malloc(sizeof(struct Node));
    n->data = value;
    n->next = head;
    return n;          // the new head
}`,
     q:{q:`Which operation is O(1) on an array but O(n) on a singly linked list?`,o:[`Access the element at index k`,`Insert after a known node`,`Delete the head node`,`Insert at the head`],a:0,e:`An array jumps straight to index k using address arithmetic. A linked list must follow k pointers from the head.`}},
    {t:'Stacks and queues', m:7,
     x:[`A stack is last-in, first-out (LIFO). You push onto the top and pop from the top, so the most recent item always comes out first. Function calls, the undo button and expression evaluation all rely on stacks.`,
        `A queue is first-in, first-out (FIFO). You enqueue at the rear and dequeue from the front, so items are served in arrival order. Print jobs, CPU scheduling and breadth-first search use queues.`],
     k:[`Stack: push and pop at one end (LIFO)`,`Queue: enqueue at rear, dequeue at front (FIFO)`,`All four operations are O(1) with a linked list or a circular array`],
     q:{q:`Which structure is the natural choice for checking balanced parentheses in an expression?`,o:[`Queue`,`Stack`,`Binary tree`,`Hash table`],a:1,e:`Push each opening bracket. When a closing bracket arrives, the most recent opening bracket (top of the stack) must match it.`}},
  ]},
  {title:'Unit 2 · Trees', lessons:[
    {t:'Binary trees and traversals', m:9,
     x:[`A binary tree is a hierarchy where each node has at most two children, called left and right. A binary search tree (BST) adds an ordering rule: every key in the left subtree is smaller than the node, and every key in the right subtree is larger.`,
        `There are three depth-first traversals. Inorder visits left, node, right. Preorder visits node, left, right. Postorder visits left, right, node. Level-order uses a queue to visit the tree level by level.`],
     k:[`Inorder of a BST gives the keys in ascending order`,`Preorder is used to copy a tree, postorder to delete one`,`Search in a BST is O(h), where h is the height of the tree`],
     c:`void inorder(struct Node *root) {
    if (root == NULL) return;
    inorder(root->left);
    printf("%d ", root->data);
    inorder(root->right);
}`,
     q:{q:`Inorder traversal of a binary search tree visits the keys in which order?`,o:[`Descending`,`Level by level`,`Ascending`,`Random`],a:2,e:`Left subtree (smaller keys), then the node, then right subtree (larger keys) always gives sorted ascending order.`}},
    {t:'AVL trees and rotations', m:10,
     x:[`A plain BST can degrade into a linked list if keys arrive in sorted order, making search O(n). An AVL tree prevents this by keeping the tree height-balanced after every insertion and deletion.`,
        `The balance factor of a node is height(left) minus height(right), and it must stay in {-1, 0, +1}. When an update pushes it to +2 or -2, the tree is repaired with rotations: LL needs a right rotation, RR needs a left rotation, LR needs a left then right rotation, and RL needs a right then left rotation.`],
     k:[`Balance factor = height(left) - height(right), allowed values -1, 0, +1`,`Four cases: LL, RR, LR, RL`,`Each rotation is O(1) and the height stays O(log n)`],
     q:{q:`After an insertion, a node has balance factor +2 and its left child has balance factor +1. Which fix is needed?`,o:[`Left rotation`,`Left-right double rotation`,`Right-left double rotation`,`Single right rotation`],a:3,e:`This is the LL case: the extra height is in the left child's left subtree, so one right rotation at the node restores balance.`}},
  ]},
  {title:'Unit 3 · Graphs', lessons:[
    {t:'Graph representation', m:7,
     x:[`A graph is a set of vertices connected by edges. An adjacency matrix is a V by V table where cell (i, j) is 1 when an edge exists. Checking an edge is O(1), but the matrix always uses O(V squared) space.`,
        `An adjacency list stores, for each vertex, the list of its neighbours. It uses O(V + E) space, which is far smaller for sparse graphs, and it lets you visit all neighbours of a vertex quickly.`],
     k:[`Matrix: O(1) edge lookup, O(V^2) space`,`List: O(V + E) space, best for sparse graphs`,`Most real-world graphs (roads, social networks) are sparse`],
     q:{q:`A sparse graph has 10,000 vertices and about 30,000 edges. Which representation is best?`,o:[`Adjacency matrix`,`Adjacency list`,`Both use the same space`,`A 3D array`],a:1,e:`A matrix would need 100 million cells. An adjacency list needs only about 40,000 entries.`}},
    {t:'BFS and DFS', m:10,
     x:[`Breadth-first search (BFS) explores a graph level by level using a queue. Because it reaches vertices in order of distance, it finds the shortest path, in number of edges, in an unweighted graph.`,
        `Depth-first search (DFS) goes as deep as possible along one path before backtracking, using recursion or a stack. It is the basis for cycle detection, topological sorting and finding connected components. With an adjacency list both searches run in O(V + E).`],
     k:[`BFS uses a queue and finds shortest paths in unweighted graphs`,`DFS uses a stack or recursion and goes deep first`,`Both run in O(V + E) with an adjacency list`],
     c:`void bfs(int start) {
    visited[start] = 1;
    enqueue(start);
    while (!isEmpty()) {
        int u = dequeue();
        printf("%d ", u);
        for (each neighbour v of u)
            if (!visited[v]) {
                visited[v] = 1;
                enqueue(v);
            }
    }
}`,
     q:{q:`Which traversal finds the path with the fewest edges in an unweighted graph?`,o:[`DFS`,`Inorder traversal`,`BFS`,`Postorder traversal`],a:2,e:`BFS visits vertices in increasing distance from the start, so the first time it reaches a vertex is along a shortest path.`}},
  ]},
 ]},

{id:'os', code:'CS302', tag:'OS', name:'Operating Systems', faculty:'Dr. Ramesh', credits:4,
 desc:'How the operating system shares the CPU and memory between programs: processes, scheduling, synchronization, deadlocks and virtual memory.',
 units:[
  {title:'Unit 1 · Processes and scheduling', lessons:[
    {t:'Processes and the PCB', m:7,
     x:[`A process is a program in execution. During its life it moves between states: new, ready (waiting for the CPU), running, waiting (blocked on I/O) and terminated.`,
        `The operating system tracks each process in a Process Control Block (PCB). The PCB stores the process ID, state, program counter, CPU registers, memory limits and open files. A context switch saves the PCB of the running process and loads the PCB of the next one.`],
     k:[`Five states: new, ready, running, waiting, terminated`,`PCB holds everything needed to resume a process`,`Context switching is pure overhead: no useful work happens during it`],
     q:{q:`What does the OS save when it performs a context switch?`,o:[`Only the program counter`,`The whole hard disk`,`The CPU state of the running process, in its PCB`,`Nothing, it is automatic`],a:2,e:`Registers, program counter and other CPU state are written into the PCB so the process can resume exactly where it stopped.`}},
    {t:'CPU scheduling', m:10,
     x:[`The scheduler picks which ready process runs next. First-Come First-Served (FCFS) is simple but suffers from the convoy effect, where short jobs wait behind a long one. Shortest Job First (SJF) gives the minimum average waiting time but needs burst-time estimates and can starve long jobs.`,
        `Round Robin gives each process a fixed time quantum and rotates through the ready queue, which suits interactive systems. Waiting time equals turnaround time minus burst time.`],
     k:[`FCFS: simple, convoy effect`,`SJF: optimal average waiting time, risk of starvation`,`Round Robin: fair, depends on the time quantum`],
     q:{q:`P1 (burst 6), P2 (burst 2) and P3 (burst 4) arrive together and run in FCFS order. What is the average waiting time?`,o:[`4.67`,`3.33`,`6.00`,`2.67`],a:0,e:`Waiting times are 0, 6 and 8. The sum is 14, and 14 / 3 = 4.67. (SJF would give 2.67.)`}},
  ]},
  {title:'Unit 2 · Synchronization and deadlocks', lessons:[
    {t:'Critical sections and semaphores', m:9,
     x:[`When two processes update shared data at the same time, the result depends on timing. This is a race condition. The code that touches shared data is the critical section, and only one process may be inside it at once.`,
        `A semaphore is an integer variable changed only by wait (P) and signal (V). A binary semaphore, or mutex, starts at 1: wait decrements it and blocks if it is already 0, and signal increments it. A correct solution gives mutual exclusion, progress and bounded waiting.`],
     k:[`Race condition: outcome depends on scheduling order`,`Three requirements: mutual exclusion, progress, bounded waiting`,`Binary semaphore value 1 means the resource is free`],
     q:{q:`What does a binary semaphore value of 1 indicate?`,o:[`The resource is locked`,`The resource is available`,`Two processes are waiting`,`A deadlock has occurred`],a:1,e:`Wait changes 1 to 0 and enters. A value of 0 means someone is inside, so other processes block.`}},
    {t:`Deadlock and the Banker's algorithm`, m:11,
     x:[`A deadlock occurs when processes wait forever for resources held by each other. It needs four conditions together: mutual exclusion, hold and wait, no preemption and circular wait. Breaking any one of them prevents deadlock.`,
        `The Banker's algorithm avoids deadlock by granting a request only if the system stays in a safe state, meaning some order exists in which every process can finish. It uses Need = Max - Allocation and checks whether Need can be met by the available resources.`],
     k:[`Four conditions: mutual exclusion, hold and wait, no preemption, circular wait`,`Need = Max - Allocation`,`Safe state: a safe sequence exists where all processes can complete`],
     q:{q:`A process has Max = 7 and Allocation = 3 for a resource. What is its Need?`,o:[`10`,`3`,`7`,`4`],a:3,e:`Need = Max - Allocation = 7 - 3 = 4.`}},
  ]},
  {title:'Unit 3 · Memory management', lessons:[
    {t:'Paging', m:8,
     x:[`Paging divides physical memory into fixed-size frames and logical memory into pages of the same size. A page table maps each page number to a frame number. A logical address is split into a page number and an offset within the page.`,
        `Because any free frame can hold any page, paging removes external fragmentation. The last page of a process may be only partly used, which causes a little internal fragmentation. A Translation Lookaside Buffer (TLB) caches recent mappings to speed up address translation.`],
     k:[`Address = page number + offset`,`No external fragmentation, small internal fragmentation`,`TLB caches page-table entries`],
     q:{q:`Paging eliminates which kind of fragmentation?`,o:[`Internal`,`External`,`Both`,`Neither`],a:1,e:`Frames are all the same size, so any free frame can be used and no unusable gaps appear between allocations.`}},
    {t:'Page replacement', m:9,
     x:[`When a page is not in memory the CPU raises a page fault, and the OS loads it from disk. If every frame is full, a page replacement algorithm picks a victim page.`,
        `FIFO removes the oldest page. LRU removes the page unused for the longest time. Optimal removes the page that will not be needed for the longest future time, which is the best possible but cannot be implemented in practice. FIFO can suffer from Belady's anomaly, where adding frames increases page faults.`],
     k:[`FIFO is simple but can show Belady's anomaly`,`LRU approximates optimal using past behaviour`,`Goal: minimise the number of page faults`],
     q:{q:`Which page replacement algorithm can show Belady's anomaly?`,o:[`LRU`,`Optimal`,`FIFO`,`All of them`],a:2,e:`With FIFO, giving a process more frames can sometimes cause more faults. LRU and Optimal never show this behaviour.`}},
  ]},
 ]},

{id:'dm', code:'MA303', tag:'DM', name:'Discrete Mathematics', faculty:'Prof. Kavitha', credits:4,
 desc:'The mathematics behind computer science: logic, sets, relations and graph theory.',
 units:[
  {title:'Unit 1 · Logic and sets', lessons:[
    {t:'Propositional logic', m:8,
     x:[`A proposition is a statement that is either true or false. Propositions combine with NOT, AND, OR, implication (p implies q) and biconditional. An implication is false in exactly one case: when p is true and q is false.`,
        `A tautology is always true, and a contradiction is always false. The contrapositive of p implies q is not q implies not p, and it is logically equivalent to the original statement.`],
     k:[`p implies q is false only when p is true and q is false`,`Contrapositive is equivalent to the original implication`,`Truth tables list every possible case`],
     q:{q:`When is the statement "p implies q" false?`,o:[`p false, q true`,`p true, q false`,`p false, q false`,`p true, q true`],a:1,e:`A promise is broken only when the condition holds but the result does not.`}},
    {t:'Sets and relations', m:9,
     x:[`A set is an unordered collection of distinct elements. You can combine sets with union, intersection, difference and complement. The power set of a set with n elements has 2 to the power n subsets.`,
        `A relation on a set is a collection of ordered pairs. It can be reflexive (every element relates to itself), symmetric, and transitive. A relation with all three properties is an equivalence relation, and it splits the set into equivalence classes.`],
     k:[`Power set of an n-element set has 2^n elements`,`Equivalence relation = reflexive + symmetric + transitive`,`Equivalence classes partition the set`],
     q:{q:`A set has 4 elements. How many subsets does it have?`,o:[`8`,`4`,`16`,`12`],a:2,e:`Each element is either in or out of a subset, so there are 2 x 2 x 2 x 2 = 16 subsets.`}},
  ]},
  {title:'Unit 2 · Graph theory', lessons:[
    {t:'Graph basics and the handshake lemma', m:8,
     x:[`The degree of a vertex is the number of edges touching it. The handshake lemma says that the sum of all degrees equals twice the number of edges, because each edge adds one to the degree of both its endpoints. A consequence is that the number of odd-degree vertices is always even.`,
        `A tree is a connected graph with no cycles, and a tree with n vertices has exactly n - 1 edges. An Euler circuit exists in a connected graph when every vertex has even degree.`],
     k:[`Sum of degrees = 2 x number of edges`,`Tree with n vertices has n - 1 edges`,`Euler circuit needs all vertices of even degree`],
     q:{q:`A graph has 5 edges. What is the sum of the degrees of all its vertices?`,o:[`5`,`10`,`25`,`Cannot be determined`],a:1,e:`By the handshake lemma, the sum of degrees = 2 x 5 = 10.`}},
    {t:'Graph colouring', m:9,
     x:[`A proper colouring gives each vertex a colour so that no two adjacent vertices share a colour. The smallest number of colours needed is the chromatic number of the graph.`,
        `A graph is bipartite exactly when it has no odd cycle, and its chromatic number is at most 2. Every planar graph can be coloured with four colours. Colouring models real problems such as exam timetabling, where each colour is a time slot and an edge joins two exams that share a student.`],
     k:[`Chromatic number = fewest colours in a proper colouring`,`Bipartite graph = 2-colourable = no odd cycles`,`Four colour theorem for planar graphs`],
     q:{q:`What is the chromatic number of a triangle (the complete graph K3)?`,o:[`2`,`4`,`1`,`3`],a:3,e:`All three vertices are adjacent to each other, so each needs its own colour.`}},
  ]},
 ]},

{id:'dbms', code:'CS304', tag:'DB', name:'Database Management Systems', faculty:'Prof. Suresh', credits:4,
 desc:'Designing, querying and protecting data: relational design, SQL, normalization, transactions and concurrency.',
 units:[
  {title:'Unit 1 · Relational model and SQL', lessons:[
    {t:'ER diagram to relational schema', m:8,
     x:[`An entity becomes a table, and its attributes become columns, with one attribute or a set of attributes chosen as the primary key. A one-to-many relationship is stored by placing the primary key of the "one" side into the "many" side as a foreign key.`,
        `A many-to-many relationship needs its own junction table whose primary key combines the keys of both entities. A weak entity becomes a table that includes the key of its owner entity.`],
     k:[`Entity to table, attribute to column`,`1:N relationship: foreign key on the N side`,`M:N relationship: separate junction table`],
     q:{q:`How is a many-to-many relationship (for example, Student and Course) mapped to tables?`,o:[`A foreign key in Student only`,`A foreign key in Course only`,`A separate table holding both keys`,`It cannot be mapped`],a:2,e:`An Enrollment table with (student_id, course_id) records each pairing without repeating data.`}},
    {t:'SQL joins', m:9,
     x:[`A join combines rows from two tables using a related column. INNER JOIN keeps only rows that match in both tables. LEFT JOIN keeps every row of the left table and fills the right side with NULL when nothing matches. RIGHT JOIN is the mirror image, and FULL JOIN keeps unmatched rows from both sides.`,
        `Joins are usually written with an ON condition that compares a foreign key to the primary key it references.`],
     k:[`INNER JOIN: matching rows only`,`LEFT JOIN: all left rows, NULL for no match`,`Join on foreign key = primary key`],
     c:`SELECT s.name, c.title
FROM student s
LEFT JOIN enrollment e ON e.student_id = s.id
LEFT JOIN course c     ON c.id = e.course_id
ORDER BY s.name;`,
     q:{q:`Which join returns every row from the left table even when there is no matching row on the right?`,o:[`INNER JOIN`,`LEFT JOIN`,`CROSS JOIN`,`SELF JOIN`],a:1,e:`LEFT JOIN preserves all left rows and shows NULL for the right-side columns when no match exists.`}},
  ]},
  {title:'Unit 2 · Normalization', lessons:[
    {t:'Functional dependencies, 1NF and 2NF', m:9,
     x:[`A functional dependency X to Y means that the value of X uniquely determines the value of Y. For example, roll number determines student name. Dependencies guide how we split tables to remove redundancy.`,
        `A table is in First Normal Form (1NF) when every cell holds a single atomic value. It is in Second Normal Form (2NF) when it is in 1NF and no non-key column depends on only part of a composite key.`],
     k:[`X to Y: X determines Y`,`1NF: atomic values, no repeating groups`,`2NF: no partial dependency on a composite key`],
     q:{q:`Second Normal Form removes which kind of dependency?`,o:[`Transitive dependency`,`Partial dependency`,`Multivalued dependency`,`Join dependency`],a:1,e:`2NF removes non-key attributes that depend on only part of a composite primary key.`}},
    {t:'3NF and BCNF', m:9,
     x:[`A table is in Third Normal Form (3NF) when it is in 2NF and no non-key column depends on another non-key column. This removes transitive dependencies, such as student to department to department head.`,
        `Boyce-Codd Normal Form (BCNF) is stricter: for every functional dependency X to Y, X must be a superkey. Every BCNF table is also in 3NF, but not the other way round. Decomposition should be lossless, and ideally dependency-preserving.`],
     k:[`3NF: no transitive dependencies`,`BCNF: every determinant is a superkey`,`BCNF is stricter than 3NF`],
     q:{q:`A table is in BCNF if, for every functional dependency X to Y, X is what?`,o:[`A foreign key`,`A candidate key attribute only`,`A superkey`,`Unique but nullable`],a:2,e:`That is the definition of BCNF: every determinant must be a superkey of the table.`}},
  ]},
  {title:'Unit 3 · Transactions', lessons:[
    {t:'Transactions and ACID', m:8,
     x:[`A transaction is a group of operations treated as one unit, such as debiting one account and crediting another. The database guarantees the ACID properties.`,
        `Atomicity means all or nothing. Consistency means the database moves from one valid state to another. Isolation means concurrent transactions do not see each other's partial work. Durability means committed changes survive a crash. COMMIT makes changes permanent and ROLLBACK undoes them.`],
     k:[`Atomicity, Consistency, Isolation, Durability`,`COMMIT saves, ROLLBACK undoes`,`Money transfer is the classic example`],
     q:{q:`Which ACID property guarantees that a transaction either completes fully or has no effect?`,o:[`Atomicity`,`Isolation`,`Durability`,`Consistency`],a:0,e:`Atomicity is the all-or-nothing rule. If any step fails, every change is rolled back.`}},
    {t:'Concurrency control and locking', m:10,
     x:[`When transactions run together, problems such as the lost update and the dirty read can appear. Locks prevent them. A shared lock allows reading, and an exclusive lock is needed for writing.`,
        `Two-phase locking (2PL) splits a transaction into a growing phase, where it only acquires locks, and a shrinking phase, where it only releases them. 2PL guarantees serializability, although it can still cause deadlocks that the DBMS must detect and resolve.`],
     k:[`Shared lock for reads, exclusive lock for writes`,`2PL: growing phase then shrinking phase`,`2PL ensures serializability but allows deadlock`],
     q:{q:`Under two-phase locking, after a transaction releases its first lock, it may:`,o:[`Acquire new locks freely`,`Only release locks, not acquire new ones`,`Restart automatically`,`Skip commit`],a:1,e:`Once the shrinking phase begins, no new lock may be acquired. That rule is what guarantees serializability.`}},
  ]},

/* ---------- course bookkeeping ---------- */
(function initCourses(){
  COURSES.forEach(c=>{
    let n=0; c.flat=[];
    c.units.forEach((u,ui)=>u.lessons.forEach(l=>{
      n++; l.id=c.id+'-'+n; l.cid=c.id; l.ui=ui; c.flat.push(l);
    }));
  });
})();
function getCourse(id){return COURSES.find(c=>c.id===id);}
function getLesson(c,lid){return c.flat.find(l=>l.id===lid);}

/* ---------- progress (saved in the browser) ---------- */
let PROG = {};
try{ PROG = JSON.parse(localStorage.getItem('gw_progress')||'null') || null; }catch(e){ PROG=null; }
if(!PROG){
  PROG = {};
  const seed = {ds:4, os:3, dm:3, dbms:2, py:2, ss:1};
  COURSES.forEach(c=>{ PROG[c.id]={}; c.flat.slice(0,seed[c.id]||0).forEach(l=>PROG[c.id][l.id]=true); });
}
function saveProg(){ try{ localStorage.setItem('gw_progress', JSON.stringify(PROG)); }catch(e){} }
function isDone(cid,lid){ return !!(PROG[cid] && PROG[cid][lid]); }
function cstat(c){
  const total=c.flat.length;
  const done=c.flat.filter(l=>isDone(c.id,l.id)).length;
  return {total, done, pct: total?Math.round(done/total*100):0};
}
function nextLesson(c){ return c.flat.find(l=>!isDone(c.id,l.id)) || null; }

/* ============ LEARNING VIEW STATE ============ */
let LV = {};   // {cid, lid}

function openCourse(cid){ LV={cid:cid}; navigate('my-learning',true); }
function openLesson(cid,lid){ LV={cid:cid,lid:lid}; navigate('my-learning',true); }
function resumeLearning(){
  const c = COURSES.find(c=>nextLesson(c));
  if(!c){ LV={}; navigate('my-learning',true); return; }
  openLesson(c.id,nextLesson(c).id);
}
function toggleDone(cid,lid,goNext){
  PROG[cid]=PROG[cid]||{};
  PROG[cid][lid]=true; saveProg();
  const c=getCourse(cid); const i=c.flat.findIndex(l=>l.id===lid);
  if(goNext){
    if(c.flat[i+1]) openLesson(cid,c.flat[i+1].id); else openCourse(cid);
  } else openLesson(cid,lid);
}
function markUndone(cid,lid){ if(PROG[cid]){delete PROG[cid][lid]; saveProg();} openLesson(cid,lid); }

/* ============ RENDER: My Learning (course list) ============ */
function renderLearning(){
  const totalLessons = COURSES.reduce((a,c)=>a+c.flat.length,0);
  const doneLessons  = COURSES.reduce((a,c)=>a+cstat(c).done,0);
  const avg = Math.round(COURSES.reduce((a,c)=>a+cstat(c).pct,0)/COURSES.length);
  const cards = COURSES.map(c=>{
    const s=cstat(c);
    const label = s.done===0?'Start course':(s.done===s.total?'Review course':'Continue');
    return `
    <div class="course-card" onclick="openCourse('${c.id}')">
      <div class="cc-top">
        <div class="cc-tag">${c.tag}</div>
        <div><div class="cc-name">${c.name}</div><div class="cc-meta">${c.code} · ${c.faculty}</div></div>
      </div>
      <div class="cc-desc">${c.desc}</div>
      <div class="bar-top"><span class="bar-name" style="font-size:12px;">Progress</span><span class="bar-val">${s.pct}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${s.pct}%"></div></div>
      <div class="cc-foot">
        <span class="cc-count">${s.done} of ${s.total} lessons</span>
        <button class="btn-solid" onclick="event.stopPropagation();${s.done===s.total?`openCourse('${c.id}')`:`openLesson('${c.id}','${nextLesson(c)?nextLesson(c).id:''}')`}">${label}</button>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="banner">
      <div>
        <div class="banner-eyebrow">ODD SEMESTER 2026 · WEEK 6</div>
        <div class="banner-title">My Learning</div>
        <div class="banner-sub">Study every course right here: read each lesson, check your understanding with a quiz, and track your progress.</div>
        <div class="banner-actions">
          <button class="btn-gold" onclick="resumeLearning()">Resume learning</button>
          <button class="btn-ghost" onclick="toggleChat(true)">Ask the assistant</button>
        </div>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-top"><div class="stat-icon">📘</div></div><div class="stat-num">${COURSES.length}</div><div class="stat-label">Active courses</div></div>
      <div class="stat-card"><div class="stat-top"><div class="stat-icon">✅</div></div><div class="stat-num">${doneLessons} / ${totalLessons}</div><div class="stat-label">Lessons completed</div></div>
      <div class="stat-card"><div class="stat-top"><div class="stat-icon">📈</div></div><div class="stat-num">${avg}%</div><div class="stat-label">Average completion</div></div>
      <div class="stat-card"><div class="stat-top"><div class="stat-icon">🏅</div></div><div class="stat-num">2</div><div class="stat-label">Certifications</div></div>
    </div>
    <div class="panel-head"><div class="panel-title">My courses</div></div>
    <div class="course-grid">${cards}</div>
  `;
}

/* ============ RENDER: course detail ============ */
function renderCourse(c){
  const s=cstat(c), nx=nextLesson(c);
  const units = c.units.map((u,ui)=>{
    const d=u.lessons.filter(l=>isDone(c.id,l.id)).length;
    const rows = u.lessons.map(l=>{
      const done=isDone(c.id,l.id), isNext = nx && nx.id===l.id;
      return `
      <div class="list-row lesson-row" onclick="openLesson('${c.id}','${l.id}')">
        <div class="list-left">
          <div class="check ${done?'on':(isNext?'now':'')}">${done?'✓':''}</div>
          <div><div class="list-title">${l.t}</div><div class="list-sub">${l.m} min read · quiz included</div></div>
        </div>
        <span class="status-chip ${done?'good':(isNext?'':'warn')}">${done?'Completed':(isNext?'Up next':'Not started')}</span>
      </div>`;
    }).join('');
    return `<div class="panel" style="margin-bottom:14px;">
      <div class="panel-head"><div class="panel-title">${u.title}</div><div class="cc-count">${d} / ${u.lessons.length} done</div></div>${rows}</div>`;
  }).join('');
  const btn = !nx ? `<button class="btn-gold" onclick="openLesson('${c.id}','${c.flat[0].id}')">Review from start</button>`
            : `<button class="btn-gold" onclick="openLesson('${c.id}','${nx.id}')">${s.done?'Continue':'Start course'}</button>`;
  return `
    <div class="crumbs"><b onclick="LV={};navigate('my-learning')">My Learning</b> / <span>${c.name}</span></div>
    <div class="banner">
      <div>
        <div class="banner-eyebrow">${c.code} · ${c.credits?c.credits+' credits':'Online certification'}</div>
        <div class="banner-title">${c.name}</div>
        <div class="banner-sub">${c.desc}</div>
        <div class="banner-actions">${btn}<button class="btn-ghost" onclick="toggleChat(true)">Ask a doubt</button></div>
      </div>
      <div class="banner-side">
        <div class="ring" style="background:conic-gradient(var(--gold) ${s.pct}%, rgba(255,255,255,.15) 0);">
          <div style="width:40px;height:40px;border-radius:50%;background:#2d1155;display:flex;align-items:center;justify-content:center;font-size:12px;">${s.pct}%</div>
        </div>
        <div><div class="side-label">PROGRESS</div><div class="side-value">${s.done} of ${s.total} lessons</div></div>
      </div>
    </div>
    <div class="split">
      <div>${units}</div>
      <div class="panel sticky">
        <div class="panel-head"><div class="panel-title">About this course</div></div>
        <div class="list-row"><div class="list-left"><div class="tag-chip">👩‍🏫</div><div><div class="list-title">${c.faculty}</div><div class="list-sub">Instructor</div></div></div></div>
        <div class="list-row"><div class="list-left"><div class="tag-chip">📚</div><div><div class="list-title">${c.flat.length} lessons in ${c.units.length} units</div><div class="list-sub">About ${c.flat.reduce((a,l)=>a+l.m,0)} minutes in total</div></div></div></div>
        <div class="list-row"><div class="list-left"><div class="tag-chip">❓</div><div><div class="list-title">${c.flat.length} practice questions</div><div class="list-sub">One after every lesson</div></div></div></div>
        <div style="margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.5;">Finish all lessons to complete the course. Your progress is saved in this browser.</div>
      </div>
    </div>
  `;
}

/* ============ RENDER: lesson ============ */
let CURQ = null;
function renderLesson(c,l){
  const i=c.flat.findIndex(x=>x.id===l.id);
  const prev=c.flat[i-1], next=c.flat[i+1];
  const done=isDone(c.id,l.id);
  CURQ = l.q;
  const paras = l.x.map(p=>`<p>${p}</p>`).join('');
  const keys  = l.k.map(k=>`<li>${k}</li>`).join('');
  const code  = l.c ? `<div class="code-cap">Example</div><div class="codeblock">${esc(l.c)}</div>` : '';
  const opts  = l.q.o.map((o,oi)=>`<button class="q-opt" id="qo${oi}" onclick="answerQ(${oi})">${String.fromCharCode(65+oi)}. ${o}</button>`).join('');
  const outline = c.units.map(u=>`
    <div class="sb-group-label" style="color:var(--muted);margin:10px 0 4px;letter-spacing:.04em;">${u.title}</div>
    ${u.lessons.map(x=>{
      const d=isDone(c.id,x.id), cur=x.id===l.id;
      return `<div class="list-row lesson-row" style="padding:8px 0;" onclick="openLesson('${c.id}','${x.id}')">
        <div class="list-left"><div class="check ${d?'on':(cur?'now':'')}" style="width:20px;height:20px;font-size:10px;">${d?'✓':''}</div>
        <div class="list-title" style="font-size:12.5px;${cur?'color:var(--purple-600);':''}">${x.t}</div></div></div>`;
    }).join('')}`).join('');
  const s=cstat(c);

  return `
    <div class="crumbs"><b onclick="LV={};navigate('my-learning')">My Learning</b> / <b onclick="openCourse('${c.id}')">${c.name}</b> / <span>${l.t}</span></div>
    <div class="split">
      <div class="panel lesson-panel">
        <div class="lesson-eyebrow">${c.units[l.ui].title} · Lesson ${i+1} of ${c.flat.length} · ${l.m} min read</div>
        <h1 class="lesson-h">${l.t}</h1>
        <div class="lesson-body">${paras}</div>
        ${code}
        <div class="keybox"><h4>Key points</h4><ul>${keys}</ul></div>
        <div class="quiz">
          <h4>Check your understanding</h4>
          <div class="quiz-q">${l.q.q}</div>
          ${opts}
          <div class="q-exp" id="qexp"></div>
        </div>
        <div class="lesson-foot">
          <button class="btn-outline" ${prev?`onclick="openLesson('${c.id}','${prev.id}')"`:'disabled'}>← Previous</button>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            ${done?`<span class="done-note">✓ Completed</span><button class="btn-outline" onclick="markUndone('${c.id}','${l.id}')">Mark as not done</button>`:''}
            ${done
              ? (next?`<button class="btn-solid" onclick="openLesson('${c.id}','${next.id}')">Next lesson →</button>`:`<button class="btn-solid" onclick="openCourse('${c.id}')">Back to course</button>`)
              : `<button class="btn-solid" onclick="toggleDone('${c.id}','${l.id}',true)">${next?'Mark complete &amp; continue':'Mark complete &amp; finish'}</button>`}
          </div>
        </div>
      </div>
      <div class="panel sticky">
        <div class="panel-head"><div class="panel-title">${c.name}</div><div class="panel-link">${s.pct}%</div></div>
        <div class="bar-track" style="margin-bottom:6px;"><div class="bar-fill" style="width:${s.pct}%"></div></div>
        <div class="cc-count" style="margin-bottom:6px;">${s.done} of ${s.total} lessons completed</div>
        ${outline}
        <button class="btn-outline" style="width:100%;margin-top:14px;" onclick="toggleChat(true);chatAsk('Explain this lesson')">Ask the assistant about this lesson</button>
      </div>
    </div>
  `;
}
function answerQ(i){
  if(!CURQ) return;
  CURQ.o.forEach((_,k)=>{
    const b=document.getElementById('qo'+k);
    b.disabled=true;
    if(k===CURQ.a) b.classList.add('correct');
    else if(k===i) b.classList.add('wrong');
  });
  const ex=document.getElementById('qexp');
  ex.style.display='block';
  ex.innerHTML=(i===CURQ.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+CURQ.e;
}

/* ============ ROUTER ============ */
function navigate(id, keepLV){
  if(!keepLV) LV = {};
  if(id!=='my-learning' || !LV.lid) CURQ = null;
  renderSidebar(id);
  const root = document.getElementById('page-root');
  if(id==='dashboard'){ root.innerHTML = renderDashboard(); }
  else if(id==='study-plan'){ root.innerHTML = renderStudyPlan(); }
  else if(id==='my-learning'){
    const c = LV.cid ? getCourse(LV.cid) : null;
    const l = (c && LV.lid) ? getLesson(c,LV.lid) : null;
    if(c && l) root.innerHTML = renderLesson(c,l);
    else if(c) root.innerHTML = renderCourse(c);
    else root.innerHTML = renderLearning();
  }
  else if(PAGES[id]){ root.innerHTML = renderGeneric(PAGES[id]); }
  else { root.innerHTML = renderDashboard(); }
  window.scrollTo(0,0);
}

/* =====================================================================
   CHATBOT — study assistant (runs fully in the browser)
   Answers portal questions from the page data above and explains
   topics by searching the course lessons.
   ===================================================================== */
const DEFAULT_CHIPS = ['What should I study next?','Explain deadlock','My attendance','Fee due date','Quiz me'];
let CHAT_READY=false, CHAT_Q=null;

function chatWelcome(){
  if(CHAT_READY) return;
  CHAT_READY=true;
  addMsg('bot',`Hi! I'm your GradeWise assistant. I can <b>explain topics from your courses</b>, quiz you, and answer questions about your attendance, fees, exams and timetable. What would you like to do?`);
  renderChips(DEFAULT_CHIPS);
}
function toggleChat(forceOpen){
  const p=document.getElementById('chat-panel');
  const open = forceOpen===true ? true : !p.classList.contains('open');
  p.classList.toggle('open',open);
  if(open){ chatWelcome(); setTimeout(()=>document.getElementById('chat-text').focus(),50); }
}
function renderChips(list){
  document.getElementById('chat-chips').innerHTML = list.map(t=>`<button class="chat-chip" onclick="chatAsk('${t.replace(/'/g,"\\'")}')">${t}</button>`).join('');
}
function addMsg(who,html){
  const box=document.getElementById('chat-msgs');
  const d=document.createElement('div');
  d.className='msg '+who; d.innerHTML=html;
  box.appendChild(d); box.scrollTop=box.scrollHeight;
  return d;
}
function chatAsk(text){ document.getElementById('chat-text').value=text; sendChat(); }
function sendChat(){
  const inp=document.getElementById('chat-text');
  const text=inp.value.trim();
  if(!text) return;
  inp.value='';
  addMsg('user',esc(text));
  const t=addMsg('bot','<span class="typing"><i></i><i></i><i></i></span>');
  setTimeout(()=>{
    t.innerHTML = botReply(text);
    document.getElementById('chat-msgs').scrollTop=1e9;
  },450);
}
document.getElementById('chat-text').addEventListener('keydown',e=>{ if(e.key==='Enter') sendChat(); });

function goBtn(label,js){ return `<button class="chat-link" onclick="${js}">${label}</button>`; }
function lessonBtn(l){ return goBtn('Open: '+esc(l.t), `openLesson('${l.cid}','${l.id}')`); }
function curLesson(){
  if(!LV.cid||!LV.lid) return null;
  const c=getCourse(LV.cid); return c?getLesson(c,LV.lid):null;
}
const STOP = new Set('the a an is are was were of to in on for and or what whats how why when which who explain tell me about define meaning mean does do did can you please give with this that it its be as by from at my i about difference between vs'.split(' '));

function searchLessons(q){
  const words=q.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2 && !STOP.has(w));
  if(!words.length) return null;
  let best=null,bs=0;
  COURSES.forEach(c=>c.flat.forEach(l=>{
    const title=l.t.toLowerCase();
    const body=(l.x.join(' ')+' '+l.k.join(' ')).toLowerCase();
    let s=0;
    words.forEach(w=>{
      if(title.includes(w)) s+=4;
      if(body.includes(w)) s+=1;
    });
    if(s>bs){bs=s;best=l;}
  }));
  return bs>=2 ? best : null;
}
function lessonSummary(l){
  const c=getCourse(l.cid);
  return `<b>${esc(l.t)}</b> <span style="color:var(--muted)">(${esc(c.name)})</span><br>${l.x[0]}<ul>${l.k.map(k=>`<li>${k}</li>`).join('')}</ul>${lessonBtn(l)}`;
}

function botReply(raw){
  const q=raw.toLowerCase().trim();
  const L=curLesson();

  // chat quiz answer (a/b/c/d) while a question is open
  if(CHAT_Q && /^(a|b|c|d|option [a-d])\b/.test(q)){
    const idx=q.replace('option ','').charCodeAt(0)-97;
    return chatQuizAnswer(idx);
  }

  if(/^(hi|hii|hello|hey|good (morning|afternoon|evening))\b/.test(q))
    return `Hello! Ask me to explain a topic (for example <i>"what is paging?"</i>), quiz you, or check your attendance, fees or exams.`;

  if(/^(help|what can you do|menu)/.test(q) || /what can you (do|help)/.test(q))
    return `Here is what I can do:<ul><li>Explain any topic from your six courses</li><li>Quiz you with practice questions</li><li>Tell you what to study next</li><li>Answer about attendance, fees, exams, timetable, grades, assignments, leave and scholarships</li></ul>`;

  if(/(explain|summar|recap|teach).*(lesson|this|page)|^(summarise|summarize) this|this lesson/.test(q)){
    if(L) return lessonSummary(L);
    return `Open a lesson first and I'll summarise it. Or tell me a topic, like <i>"explain AVL rotations"</i>.`;
  }

  if(/quiz|test me|practice question|ask me a question/.test(q)){
    let pool = L ? [L] : COURSES.flatMap(c=>c.flat);
    const l = pool[Math.floor(Math.random()*pool.length)];
    CHAT_Q=l;
    return `<b>Quick quiz</b> <span style="color:var(--muted)">(${esc(l.t)})</span><br>${l.q.q}<br>${l.q.o.map((o,i)=>goBtn(String.fromCharCode(65+i)+'. '+esc(o),`chatAsk('${String.fromCharCode(97+i)}')`)).join('')}`;
  }

  if(/(next|continue|resume).*(lesson|course|learn|study)|what (should|do) i (study|learn)|study next/.test(q)){
    const c=COURSES.filter(c=>nextLesson(c)).sort((a,b)=>cstat(a).pct-cstat(b).pct)[0];
    if(!c) return `You have completed every lesson. Great work! Use <i>Quiz me</i> to revise.`;
    const l=nextLesson(c), s=cstat(c);
    return `Your lowest-progress course is <b>${esc(c.name)}</b> (${s.pct}% done). A good next step is <b>${esc(l.t)}</b>, about ${l.m} minutes.<br>${lessonBtn(l)}`;
  }

  if(/my (courses|progress)|course progress|how (far|much).*(done|completed)/.test(q)){
    return `Your course progress:<ul>${COURSES.map(c=>`<li>${esc(c.name)}: <b>${cstat(c).pct}%</b> (${cstat(c).done}/${cstat(c).total} lessons)</li>`).join('')}</ul>${goBtn('Open My Learning',"navigate('my-learning')")}`;
  }

  // ----- portal questions -----
  if(/attendance|absent|present|75 ?%/.test(q))
    return `Your overall attendance is <b>92%</b>, above the 75% minimum.<ul><li>Data Structures 95%</li><li>Discrete Mathematics 90%</li><li>Operating Systems 78%</li><li>DBMS 74%, <b>below the 75% minimum</b></li></ul>Try not to miss any DBMS classes.<br>${goBtn('Open Attendance',"navigate('attendance')")}`;
  if(/fee|fees|bill|billing|pay|payment|tuition|due/.test(q))
    return `You have <b>₹12,400</b> due on <b>Aug 5</b>. You have paid ₹48,600 so far this year.<br>${goBtn('Open Billing',"navigate('billing')")}`;
  if(/exam|hall ticket|date sheet|internal assessment/.test(q))
    return `Internal Assessment II starts on <b>Sep 14</b>:<ul><li>Sep 14 · Data Structures</li><li>Sep 16 · Operating Systems</li><li>Sep 18 · Discrete Mathematics</li><li>Sep 20 · DBMS</li><li>Sep 22 · Soft Skills (viva)</li></ul>Your seat is S-042 in B-Block.<br>${goBtn('Exam Schedules',"navigate('exam-schedules')")}`;
  if(/timetable|schedule|class(es)? today|today.?s class|period/.test(q))
    return `Today's classes:<ul><li>9:00 · Data Structures, Room 204</li><li>10:00 · Operating Systems, Room 118</li><li>11:15 · Discrete Mathematics, Room 204</li><li>1:30 · DBMS Lab, Lab 3</li><li>3:00 · Soft Skills, Seminar Hall</li></ul>${goBtn('Open Timetable',"navigate('timetable')")}`;
  if(/cgpa|gpa|grade|marks|result/.test(q))
    return `Your CGPA is <b>8.4</b> and this semester's GPA is <b>8.7</b> (up 0.3 from last semester). Data Structures and Discrete Mathematics are your strongest subjects, and DBMS has the most room to improve.<br>${goBtn('Overall Grade',"navigate('overall-grade')")}`;
  if(/assignment|submission|homework/.test(q))
    return `You have <b>5</b> active assignments, <b>2</b> due this week:<ul><li>Aug 6 · DS, AVL tree implementation</li><li>Aug 8 · OS, Banker's algorithm report</li></ul>${goBtn('Open Assignments',"navigate('assignments')")}`;
  if(/leave|medical/.test(q))
    return `You have <b>7</b> leave days remaining. One request (Aug 9, family function) is waiting for mentor approval.<br>${goBtn('Open Leave',"navigate('leave')")}`;
  if(/scholar|bursary|aid/.test(q))
    return `Your <b>₹25,000</b> merit scholarship has been disbursed, and the state education aid application is under review.<br>${goBtn('Open Scholarship',"navigate('scholarship')")}`;
  if(/holiday/.test(q))
    return `The next holiday is <b>Independence Day on Aug 15</b>. After that: Oct 2 (Gandhi Jayanti) and Oct 20 (Deepavali, 3-day break).<br>${goBtn('Open Holidays',"navigate('holidays')")}`;
  if(/counsel|mentor|stress/.test(q))
    return `Your mentor is <b>Dr. Ramesh</b>, and your career guidance session is booked for Aug 7 at 3:00 PM. If you ever feel overwhelmed, the 24/7 helpline is on the Counselling page.<br>${goBtn('Open Counselling',"navigate('counselling')")}`;
  if(/announce|notice/.test(q))
    return `Latest notices: fee deadline extended to Aug 5, Internal Assessment II schedule released, and the TCS and Infosys placement drive.<br>${goBtn('Open Announcements',"navigate('announcement')")}`;
  if(/thank|thanks|thx/.test(q)) return `You're welcome! Good luck with your studies.`;
  if(/^(bye|goodbye)/.test(q)) return `Goodbye! Come back any time you have a doubt.`;

  // ----- course topic search -----
  const hit = searchLessons(raw);
  if(hit) return `Here is what your course material says:<br><br>${lessonSummary(hit)}`;

  return `I couldn't find that in your course material or portal data. Try a topic from your courses, such as <i>"BFS vs DFS"</i>, <i>"what is BCNF?"</i> or <i>"round robin scheduling"</i>, or ask about attendance, fees or exams.`;
}
function chatQuizAnswer(idx){
  const l=CHAT_Q; CHAT_Q=null;
  const ok = idx===l.q.a;
  return `${ok?'<b>Correct!</b>':'<b>Not quite.</b> The right answer is '+String.fromCharCode(65+l.q.a)+'.'} ${l.q.e}<br>${lessonBtn(l)}${goBtn('Another question',"chatAsk('quiz me')")}`;
}
